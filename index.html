<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative POS & ERP System</title>
    <!-- Import Tailwind, Vue, Chart.js, dan Supabase JS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; background: white; }
            .no-print { display: none !important; }
            
            .print-58mm { width: 58mm; max-width: 58mm; margin: 0 auto; padding: 2mm; font-family: monospace; color: black; }
            .print-58mm body { margin: 0; padding: 0; }
            
            .print-a4 { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 15mm; font-family: 'Inter', sans-serif; color: black; background: white; }
            @page { margin: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- Loader -->
        <div v-if="loading" class="fixed inset-0 bg-white backdrop-blur-sm z-50 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600"></div>
            <p class="mt-4 text-slate-600 font-medium">Berkomunikasi dengan database...</p>
        </div>

        <!-- Layar Login -->
        <div v-if="!isLoggedIn && !loading" class="w-full h-full flex items-center justify-center bg-slate-900 absolute inset-0 z-50">
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm mx-4">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-blue-600 tracking-wider">CREATIVE<span class="text-slate-800">POS</span></h1>
                    <p class="text-sm text-slate-500 mt-2">Masuk ke sistem database</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                        <input type="text" v-model="loginForm.username" @keyup.enter="doLogin" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <input type="password" v-model="loginForm.password" @keyup.enter="doLogin" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button @click="doLogin" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg mt-4">Masuk</button>
                </div>
            </div>
        </div>

        <template v-if="isLoggedIn && !loading">
            <!-- AREA CETAK STRUK & A4 -->
            <div id="print-area" class="hidden print:block bg-white text-black z-50">
                
                <!-- Struk 58mm Kasir & Pembelian -->
                <div v-if="printMode === 'struk' && printData" class="print-58mm p-2">
                    <div class="text-center font-bold text-lg">{{ getSetting('NamaToko') }}</div>
                    <div class="text-center text-xs mb-2">{{ getSetting('Alamat') }} | {{ getSetting('NoTelp') }}</div>
                    <div class="border-b mb-2 border-black border-dashed"></div>
                    <div class="text-center font-bold text-sm mb-2" v-if="printData.tipe === 'Pembelian'">STRUK PEMBELIAN</div>
                    <div class="text-xs mb-1">Tgl: {{ printData.tanggal }}</div>
                    <div class="text-xs mb-2">No: {{ printData.id }}</div>
                    <div class="text-xs mb-2">{{ printData.tipe === 'Pembelian' ? 'Supplier' : 'Plg' }}: {{ printData.kontak }}</div>
                    <div class="border-b mb-2 border-black border-dashed"></div>
                    <table class="text-xs mb-2 w-full">
                        <tr v-for="item in printData.items" :key="item.Kode">
                            <td colspan="3" class="pb-1">
                                <div>{{ item.Nama }}</div>
                                <div class="flex justify-between">
                                    <span>{{ item.Qty }} {{ printData.tipe === 'Pembelian' ? (item.SatuanBeli||'Dus') : (item.UOM || item.SatuanJual || 'Pcs') }} x {{ formatRp(printData.tipe === 'Pembelian' ? item.HargaBeli : (item.UOM === item.SatuanBeli ? item.HargaJualGrosir : item.HargaJual)) }}</span>
                                    <span>{{ formatRp(item.Qty * (printData.tipe === 'Pembelian' ? item.HargaBeli : (item.UOM === item.SatuanBeli ? item.HargaJualGrosir : item.HargaJual))) }}</span>
                                </div>
                            </td>
                        </tr>
                    </table>
                    <div class="border-b mb-2 border-black border-dashed"></div>
                    <div class="flex justify-between font-bold text-sm"><span>TOTAL:</span><span>{{ formatRp(printData.total) }}</span></div>
                    <div class="flex justify-between text-xs mt-1"><span>Telah Dibayar:</span><span>{{ formatRp(printData.bayar) }}</span></div>
                    <div class="flex justify-between text-xs font-bold text-rose-600" v-if="printData.sisa > 0"><span>SISA TAGIHAN:</span><span>{{ formatRp(printData.sisa) }}</span></div>
                    <div class="flex justify-between text-xs" v-else><span>KEMBALI:</span><span>{{ formatRp(printData.kembali) }}</span></div>
                    <div class="text-center text-xs mt-4">{{ getSetting('FooterNota') }}</div>
                </div>

                <!-- Struk 58mm Cicilan Hutang/Piutang -->
                <div v-if="printMode === 'struk_bayar' && printData" class="print-58mm p-2">
                    <div class="text-center font-bold text-lg">{{ getSetting('NamaToko') }}</div>
                    <div class="text-center text-xs mb-2">{{ getSetting('Alamat') }}</div>
                    <div class="border-b mb-2 border-black border-dashed"></div>
                    <div class="text-center font-bold text-sm mb-2">BUKTI BAYAR CICILAN {{ printData.tipe.toUpperCase() }}</div>
                    <div class="text-xs mb-1">Tgl: {{ printData.tanggal }}</div>
                    <div class="text-xs mb-1">Ref: {{ printData.id }}</div>
                    <div class="text-xs mb-2">{{ printData.tipe === 'Hutang' ? 'Supplier' : 'Klien' }}: {{ printData.kontak }}</div>
                    <div class="border-b mb-2 border-black border-dashed"></div>
                    <div class="flex justify-between font-bold text-sm"><span>JUMLAH CICILAN:</span><span>{{ formatRp(printData.jumlah) }}</span></div>
                    <div class="text-xs mt-2">Ket: {{ printData.keterangan }}</div>
                    <div class="text-center text-xs mt-4">{{ getSetting('FooterNota') }}</div>
                </div>

                <!-- Invoice & Surat Jalan A4 -->
                <div v-if="(printMode === 'invoice_a4' || printMode === 'surat_jalan') && printData" class="print-a4">
                    <div class="flex justify-between items-start border-b-2 border-black pb-4 mb-4">
                        <div>
                            <h1 class="text-3xl font-bold uppercase">{{ printMode === 'surat_jalan' ? 'Surat Jalan' : 'Invoice ' + printData.tipe }}</h1>
                            <p class="text-sm mt-1 font-bold">{{ getSetting('NamaToko') }}</p>
                            <p class="text-sm">{{ getSetting('Alamat') }}</p>
                            <p class="text-sm">Telp: {{ getSetting('NoTelp') }}</p>
                        </div>
                        <div class="text-right text-sm">
                            <p class="font-bold">Kepada Yth:</p>
                            <p class="text-lg">{{ printData.kontak }}</p>
                            <p>Tgl: {{ printData.tanggal }}</p>
                            <p>No: {{ printData.id }}</p>
                        </div>
                    </div>
                    <table class="w-full text-sm text-left border-collapse border border-black mb-4">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-black p-2 w-10 text-center">No</th>
                                <th class="border border-black p-2">Nama Barang</th>
                                <th class="border border-black p-2 text-center">Qty</th>
                                <th v-if="printMode === 'invoice_a4'" class="border border-black p-2 text-right">Harga</th>
                                <th v-if="printMode === 'invoice_a4'" class="border border-black p-2 text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(item, idx) in printData.items" :key="idx">
                                <td class="border border-black p-2 text-center">{{ idx + 1 }}</td>
                                <td class="border border-black p-2">{{ item.Nama }}</td>
                                <td class="border border-black p-2 text-center">{{ item.Qty }} {{ printData.tipe === 'Pembelian' ? (item.SatuanBeli||'Dus') : (item.UOM || item.SatuanJual || 'Pcs') }}</td>
                                <td v-if="printMode === 'invoice_a4'" class="border border-black p-2 text-right">{{ formatRp(printData.tipe === 'Pembelian' ? item.HargaBeli : (item.UOM === item.SatuanBeli ? item.HargaJualGrosir : item.HargaJual)) }}</td>
                                <td v-if="printMode === 'invoice_a4'" class="border border-black p-2 text-right">{{ formatRp((printData.tipe === 'Pembelian' ? item.HargaBeli : (item.UOM === item.SatuanBeli ? item.HargaJualGrosir : item.HargaJual)) * item.Qty) }}</td>
                            </tr>
                        </tbody>
                        <tfoot v-if="printMode === 'invoice_a4'">
                            <tr><td colspan="4" class="border border-black p-2 text-right font-bold">TOTAL</td><td class="border border-black p-2 text-right font-bold">{{ formatRp(printData.total) }}</td></tr>
                            <tr><td colspan="4" class="border border-black p-2 text-right">TELAH DIBAYAR</td><td class="border border-black p-2 text-right">{{ formatRp(printData.bayar) }}</td></tr>
                            <tr v-if="printData.sisa > 0"><td colspan="4" class="border border-black p-2 text-right font-bold text-rose-600">SISA TAGIHAN</td><td class="border border-black p-2 text-right font-bold text-rose-600">{{ formatRp(printData.sisa) }}</td></tr>
                            <tr v-else><td colspan="4" class="border border-black p-2 text-right">KEMBALI</td><td class="border border-black p-2 text-right">{{ formatRp(printData.kembali) }}</td></tr>
                        </tfoot>
                    </table>
                    <div class="flex justify-between mt-12 text-center text-sm">
                        <div class="w-1/3">
                            <p class="mb-16">Hormat Kami,</p>
                            <p class="border-t border-black inline-block px-8">( {{ getSetting('PihakToko') }} )</p>
                        </div>
                        <div class="w-1/3">
                            <p class="mb-16">Penerima,</p>
                            <p class="border-t border-black inline-block px-8">( {{ printData.kontak }} )</p>
                        </div>
                    </div>
                </div>

                <!-- Laporan HTML A4 Umum -->
                <div v-if="printMode === 'laporan' && printHTMLContent" class="print-a4">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold uppercase">{{ routeTitle }}</h2>
                        <p class="text-sm text-gray-500">{{ getSetting('NamaToko') }} | Filter: {{ reportFilterDate || 'Semua Waktu' }}</p>
                    </div>
                    <div v-html="printHTMLContent"></div>
                </div>
            </div>
            <!-- AKHIR AREA CETAK -->

            <div :class="`bg-slate-900 text-white w-64 flex-shrink-0 transition-transform duration-300 absolute md:relative z-40 h-full ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`">
                <div class="p-4 flex items-center justify-between border-b border-slate-800">
                    <div class="font-bold text-xl tracking-wider text-blue-400">CREATIVE<span class="text-white">POS</span></div>
                    <button @click="sidebarOpen = false" class="md:hidden text-slate-400 hover:text-white">✕</button>
                </div>
                <nav class="p-4 space-y-1 overflow-y-auto h-[calc(100vh-70px)]">
                    <a v-if="hasAccess('dashboard')" @click="currentRoute = 'dashboard'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'dashboard' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">📊 Dashboard</a>
                    
                    <div v-if="hasAccess('pos') || hasAccess('pembelian')" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-4">Transaksi</div>
                    <a v-if="hasAccess('pos')" @click="currentRoute = 'pos'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'pos' ? 'bg-emerald-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">🛒 Kasir (POS)</a>
                    <a v-if="hasAccess('pembelian')" @click="currentRoute = 'pembelian'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'pembelian' ? 'bg-orange-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">📥 Masuk Barang</a>
                    
                    <div v-if="hasAccess('barang') || hasAccess('supplier') || hasAccess('pelanggan') || hasAccess('karyawan')" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-4">Master Data</div>
                    <a v-if="hasAccess('barang')" @click="currentRoute = 'barang'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'barang' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">📦 Data Barang</a>
                    <a v-if="hasAccess('supplier')" @click="currentRoute = 'supplier'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'supplier' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">🚚 Supplier</a>
                    <a v-if="hasAccess('pelanggan')" @click="currentRoute = 'pelanggan'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'pelanggan' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">👥 Pelanggan</a>
                    <a v-if="hasAccess('karyawan')" @click="currentRoute = 'karyawan'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'karyawan' ? 'bg-purple-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">🧑‍💼 Karyawan</a>
                    
                    <div v-if="hasAccess('lap_penjualan') || hasAccess('lap_piutang') || hasAccess('lap_pembelian') || hasAccess('lap_hutang') || hasAccess('lap_stok') || hasAccess('lap_labarugi') || hasAccess('lap_barangrusak') || hasAccess('pengaturan')" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 mb-2 px-4">Laporan & Setting</div>
                    <a v-if="hasAccess('lap_penjualan') || hasAccess('lap_piutang') || hasAccess('lap_pembelian') || hasAccess('lap_hutang') || hasAccess('lap_stok') || hasAccess('lap_labarugi') || hasAccess('lap_barangrusak')" @click="currentRoute = 'laporan'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'laporan' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">📑 Laporan Lengkap</a>
                    <a v-if="hasAccess('pengaturan')" @click="currentRoute = 'pengaturan'; sidebarOpen = false" :class="`block px-4 py-2.5 rounded-lg cursor-pointer transition ${currentRoute === 'pengaturan' ? 'bg-slate-700 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`">⚙️ Pengaturan</a>
                </nav>
            </div>

            <!-- Bagian Konten Kanan -->
            <div class="flex-1 flex flex-col w-full">
                <!-- Header Atas -->
                <header class="bg-white shadow-sm border-b px-4 lg:px-6 h-16 flex items-center justify-between z-10 flex-shrink-0">
                    <div class="flex items-center">
                        <button @click="sidebarOpen = true" class="md:hidden mr-4 text-slate-500 hover:text-slate-800">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                        <h1 class="text-xl font-semibold text-slate-800 truncate">{{ routeTitle }}</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-sm font-medium text-slate-500 hidden sm:block">{{ todayDate }}</div>
                        <div class="flex items-center bg-slate-100 rounded-full pr-4 p-1 space-x-2">
                            <div class="h-8 w-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs uppercase">{{ currentUser?.Nama.charAt(0) }}</div>
                            <div class="text-xs">
                                <p class="font-bold text-slate-700 leading-tight">{{ currentUser?.Nama }}</p>
                                <p class="text-slate-500 leading-tight">{{ currentUser?.Jabatan }}</p>
                            </div>
                        </div>
                        <button @click="doLogout" class="text-sm font-bold text-red-500 hover:text-red-700">Keluar</button>
                    </div>
                </header>

                <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 p-4 lg:p-6 pb-24">
                    
                    <!-- MENU: Dashboard -->
                    <div v-if="currentRoute === 'dashboard' && hasAccess('dashboard')" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-emerald-500">
                                <p class="text-sm text-slate-500 mb-1">Penjualan Hari Ini</p>
                                <h3 class="text-2xl font-bold text-slate-800">{{ formatRp(dashboardStats.penjualanHariIni) }}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-teal-500">
                                <p class="text-sm text-slate-500 mb-1">Laba Bersih Hari Ini</p>
                                <h3 class="text-2xl font-bold text-slate-800">{{ formatRp(dashboardStats.labaHariIni) }}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-orange-500">
                                <p class="text-sm text-slate-500 mb-1">Pembelian Hari Ini</p>
                                <h3 class="text-2xl font-bold text-slate-800">{{ formatRp(dashboardStats.pembelianHariIni) }}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-blue-500">
                                <p class="text-sm text-slate-500 mb-1">Aset Barang (HPP)</p>
                                <h3 class="text-2xl font-bold text-slate-800">{{ formatRp(dashboardStats.asetBarang) }}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-rose-500">
                                <p class="text-sm text-slate-500 mb-1">Piutang Pelanggan</p>
                                <h3 class="text-2xl font-bold text-slate-800">{{ formatRp(dashboardStats.piutangPelanggan) }}</h3>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-purple-500">
                                <p class="text-sm text-slate-500 mb-1">Sisa Hutang Supplier</p>
                                <h3 class="text-2xl font-bold text-slate-800">{{ formatRp(dashboardStats.hutangSupplier) }}</h3>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                <h3 class="font-bold text-slate-800 mb-4">Grafik 10 Barang Terlaris (Qty)</h3>
                                <canvas id="topItemsChart" class="w-full max-h-[300px]"></canvas>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                <h3 class="font-bold text-slate-800 mb-4 text-rose-600">Peringatan Stok Menipis</h3>
                                <div class="space-y-3 max-h-[300px] overflow-y-auto">
                                    <div v-for="b in (db.barang || []).filter(x => (x.StokBagus||0) <= 5)" class="flex justify-between items-center pb-2 border-b">
                                        <div>
                                            <p class="font-medium text-sm">{{ b.Nama }}</p>
                                            <p class="text-xs text-slate-500">{{ b.Kode }}</p>
                                        </div>
                                        <span class="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-bold">{{ b.StokBagus || 0 }} {{ b.SatuanJual||b.SatuanBeli }}</span>
                                    </div>
                                    <p v-if="(db.barang || []).filter(x => (x.StokBagus||0) <= 5).length === 0" class="text-sm text-slate-500 italic text-center py-4">Semua stok aman.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- MENU: POS Kasir -->
                    <div v-else-if="currentRoute === 'pos'" class="flex flex-col lg:flex-row gap-6 h-full">
                        <div class="w-full lg:w-7/12 flex flex-col bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                            <div class="mb-4">
                                <input type="text" v-model="posSearch" placeholder="Cari Nama/Kode Barang..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <p class="text-xs text-slate-500 mt-1 italic" v-if="posSearch === ''">Menampilkan 10 barang terlaris...</p>
                            </div>
                            <div class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-3 content-start">
                                <div v-for="b in filteredPosBarang" @click="addToCart(b, 'pos')" class="border rounded-lg p-3 cursor-pointer hover:border-blue-500 hover:shadow-md transition bg-slate-50 flex flex-col justify-between h-28 relative">
                                    <div>
                                        <h4 class="font-semibold text-sm leading-tight text-slate-800">{{ b.Nama }}</h4>
                                        <p class="text-xs text-slate-500 mt-1">{{ b.Kode }}</p>
                                    </div>
                                    <div class="flex justify-between items-end mt-2">
                                        <span class="text-blue-600 font-bold text-sm">{{ formatRp(b.HargaJual) }}<span class="text-[10px] text-slate-500 font-normal"> /{{ b.SatuanJual||'Pcs' }}</span></span>
                                        <span class="text-xs bg-slate-200 px-1.5 py-0.5 rounded font-medium">Sisa: {{ b.StokBagus || 0 }}</span>
                                    </div>

                const listPiutang = computed(() => (db.value.penjualan||[]).filter(x => x.Status !== 'Lunas' && (!reportFilterPelanggan.value || x.Pelanggan === reportFilterPelanggan.value)));

                    if(reportType.value === 'piutang') {

                    }
                    
                    if(reportType.value === 'hutang') {

                        if (reportFilterSupplier.value) d = d.filter(x => x.Supplier === reportFilterSupplier.value);

                const reportDynamicColumns = computed(() => {

                    if(reportType.value === 'bayar_piutang') return [{key:'Tanggal', label:'Tgl Bayar'}, {key:'ID_Trx', label:'No. Struk Piutang'}, {key:'Pelanggan', label:'Pelanggan'}, {key:'JumlahBayar', label:'Nominal Cicilan', type:'currency'}];
                    return [];

                const reportTotals = computed(() => {

                const dashboardStats = computed(() => {
                    let tgl = todayDate.value;
                    let pJual = (db.value.penjualan||[]).filter(x => (x.Tanggal||'').startsWith(tgl)).reduce((s,i) => s + Number(i.Total||0), 0);

                    let pBeli = (db.value.pembelian||[]).filter(x => (x.Tanggal||'').startsWith(tgl)).reduce((s,i) => s + Number(i.Total||0), 0);
                    let aset = (db.value.barang||[]).reduce((s,i) => s + (((Number(i.StokBagus)||0) / (Number(i.Isi)||1)) * Number(i.HargaBeli||0)), 0);
                    let piutang = (db.value.penjualan||[]).filter(x => x.Status !== 'Lunas').reduce((s,i) => s + (Number(i.Total||0) - Number(i.Bayar||0)), 0);
                    let hutang = (db.value.pembelian||[]).filter(x => x.Status !== 'Lunas').reduce((s,i) => s + (Number(i.Total||0) - Number(i.Bayar||0)), 0);
                    return { penjualanHariIni: pJual, labaHariIni: labaJual, pembelianHariIni: pBeli, asetBarang: aset, piutangPelanggan: piutang, hutangSupplier: hutang };
                });

                // Kalkulasi Otomatis Info Sisa Piutang Pelanggan di POS Kasir
                const pelangganPiutangTotal = computed(() => {

                        .filter(x => x.Pelanggan === pos.value.pelanggan && x.Status !== 'Lunas')
                        .reduce((sum, item) => sum + ((Number(item.Total) || 0) - (Number(item.Bayar) || 0)), 0);

                const renderChart = () => {
                    if (currentRoute.value !== 'dashboard' || !hasAccess('dashboard')) return;

                    modal.value = { show: true, type: currentRoute.value, title: (row ? 'Edit ' : 'Tambah ') + (routeTitle.value.split(' ')[1] || routeTitle.value) };

                // === FUNGSI DATABASE (SUPABASE) === //

                const getTableForRoute = () => {

                    return map[currentRoute.value];

                const getTableIdField = () => currentRoute.value === 'karyawan' || currentRoute.value === 'barang' ? 'Kode' : 'ID';

                const submitForm = async () => {
                    if (currentRoute.value === 'barang') {

                    }

                            let prefix = { barang: 'BRG-', supplier: 'SUP-', pelanggan: 'PLG-', karyawan: 'KAR-' }[currentRoute.value];
                            dataToSave[idField] = await generateId(table, prefix, 4);

                    } catch(e) { showToast('Gagal', 'error'); console.error(e); } finally { loading.value = false; }

                const deleteData = async (id) => {
                    if(!confirm('Hapus data ini?')) return;

                        const table = getTableForRoute();
                        const idField = getTableIdField();

                        const { data } = await supabaseClient.from(table).select('*');
                        db.value[currentRoute.value] = data;
                        showToast('Terhapus');
                    } catch(e) { showToast('Gagal', 'error'); } finally { loading.value = false; }
                };

                const addToCart = (b, type) => {
                    let cart = type === 'pos' ? pos.value : beli.value;
                    let ex = cart.items.find(i => i.Kode === b.Kode);
                    if(ex) {
                        let multiplier = (type === 'pos' && ex.UOM === ex.SatuanBeli) ? (ex.Isi || 1) : 1;
                        if(type==='pos' && (ex.Qty + 1)*multiplier > (b.StokBagus || 0)) { showToast('Stok tidak cukup!', 'error'); return; }
                        ex.Qty++;
                    } else {
                        if(type==='pos' && (b.StokBagus || 0) <= 0) { showToast('Stok habis!', 'error'); return; }
                        cart.items.push({...b, Qty: 1, UOM: b.SatuanJual}); 
                    }
                    if(type === 'pos') posSearch.value = ''; else beliSearch.value = '';
                };

                const updateCartQty = (idx, step, type) => {
                    let cart = type === 'pos' ? pos.value : beli.value;
                    let item = cart.items[idx];
                    let realStock = ((db.value.barang||[]).find(b => b.Kode === item.Kode) || {}).StokBagus || 0;
                    
                    let multiplier = (type === 'pos' && item.UOM === item.SatuanBeli) ? (item.Isi || 1) : 1;
                    let requestedQty = (item.Qty + step) * multiplier;

                    if(type === 'pos' && step > 0 && requestedQty > realStock) { showToast('Stok tidak cukup', 'error'); return; }
                    item.Qty += step;
                    if(item.Qty < 1) item.Qty = 1;
                };

                const openPaymentModal = (type) => { paymentModal.value = { show: true, type: type, total: type === 'pos' ? posTotal.value : beliTotal.value, bayar: type === 'pos' ? posTotal.value : 0 }; };

                const processTransaction = async () => {
                    loading.value = true;
                    try {
                        let type = paymentModal.value.type;
                        let cart = type === 'pos' ? pos.value : beli.value;
                        let total = paymentModal.value.total;
                        let bayar = paymentModal.value.bayar;
                        let kembali = bayar - total;
                        let table = type === 'pos' ? 'Penjualan' : 'Pembelian';
                        
                        let trxId = cart.editingId || await generateId(table, type === 'pos' ? 'TRX-' : 'IN-', 6);
                        const isoDate = cart.tanggal + 'T' + new Date().toTimeString().split(' ')[0];

                        if (cart.editingId) {
                            const { data: oldTrx } = await supabaseClient.from(table).select('ItemsJSON').eq('ID', trxId).single();
                            if(oldTrx) {
                                let oldItems = oldTrx.ItemsJSON;
                                for(let oi of oldItems) {
                                    let b = db.value.barang.find(x => x.Kode === oi.Kode);
                                    if(b) {
                                        let qtyRev = type === 'pos' ? (oi.UOM === oi.SatuanBeli ? (oi.Qty * oi.Isi) : oi.Qty) : (oi.Qty * oi.Isi);
                                        let newVal = type === 'pos' ? (b.StokBagus + qtyRev) : (b.StokBagus - qtyRev);
                                        await supabaseClient.from('Barang').update({ StokBagus: newVal }).eq('Kode', oi.Kode);
                                    }
                                }
                            }
                            await supabaseClient.from(table).delete().eq('ID', trxId);
                        }

                        let laba = 0;
                        for(let item of cart.items) {
                            let b = db.value.barang.find(x => x.Kode === item.Kode);
                            if(b) {
                                let hargaJualReal = item.UOM === item.SatuanBeli ? (item.HargaJualGrosir || (item.HargaJual * item.Isi)) : item.HargaJual;
                                let modalReal = item.UOM === item.SatuanBeli ? item.HargaBeli : (item.HargaBeli / (item.Isi || 1));
                                laba += (hargaJualReal - modalReal) * item.Qty;
                                
                                let qtyMod = type === 'pos' ? (item.UOM === item.SatuanBeli ? (item.Qty * item.Isi) : item.Qty) : (item.Qty * item.Isi);
                                let newVal = type === 'pos' ? (b.StokBagus - qtyMod) : (b.StokBagus + qtyMod);
                                
                                let updateData = { StokBagus: newVal };
                                if(type === 'pembelian') updateData.HargaBeli = item.HargaBeli;
                                
                                await supabaseClient.from('Barang').update(updateData).eq('Kode', item.Kode);
                            }
                        }

                        let payload = {
                            ID: trxId, Tanggal: isoDate, Total: total, Bayar: bayar, 
                            Kembali: kembali >= 0 ? kembali : 0, 
                            Status: bayar >= total ? 'Lunas' : (type === 'pos' ? 'Piutang' : 'Hutang'),
                            ItemsJSON: cart.items
                        };
                        if(type === 'pos') { payload.Pelanggan = cart.pelanggan || 'Umum (Cash)'; payload.Laba = laba; } 
                        else payload.Supplier = cart.supplier || 'Umum';

                        await supabaseClient.from(table).insert([payload]);

                        const { data: newBrgData } = await supabaseClient.from('Barang').select('*');

                        cancelEdit(type); paymentModal.value.show = false;

                const hapusTransaksi = async (id, type) => {

                                if(b) {
                                    let qtyRev = type === 'pos' ? (oi.UOM === oi.SatuanBeli ? (oi.Qty * oi.Isi) : oi.Qty) : (oi.Qty * oi.Isi);
                                    let newVal = type === 'pos' ? (b.StokBagus + qtyRev) : (b.StokBagus - qtyRev);
                                    await supabaseClient.from('Barang').update({ StokBagus: newVal }).eq('Kode', oi.Kode);
                                }
                            }

                    let b = (db.value.barang||[]).find(x => x.Kode === barangRusakForm.value.KodeBarang);

                        modal.value.show = false; showToast('Tercatat!');
                    } catch(e) { showToast('Gagal', 'error'); } finally { loading.value = false; }

                const submitBayarHutang = async () => {

                    } catch(e) { showToast('Gagal', 'error'); } finally { loading.value = false; }

                const saveSettings = async () => {

                        // Simpan Permission Role JSON
                        await supabaseClient.from('Pengaturan').upsert({ Key: 'RolePermissions', Value: JSON.stringify(rolePermissions.value) });
                        
                        const { data } = await supabaseClient.from('Pengaturan').select('*');
                        db.value.pengaturan = data;
                        showToast('Tersimpan & Diperbarui'); 
                    } catch(e) { showToast('Gagal', 'error'); } finally { loading.value = false; } 
                };

                const openRoleModal = (idx) => {
                    if(idx === -1) roleModal.value = { show: true, index: -1, role: '', perms: [] };
                    else roleModal.value = { show: true, index: idx, role: rolePermissions.value[idx].role, perms: [...rolePermissions.value[idx].perms] };
                };

                const saveRole = () => {
                    if(!roleModal.value.role) return showToast('Nama level harus diisi!', 'error');
                    let r = [...rolePermissions.value];
                    if(roleModal.value.index === -1) r.push({ role: roleModal.value.role, perms: roleModal.value.perms });
                    else { r[roleModal.value.index].role = roleModal.value.role; r[roleModal.value.index].perms = roleModal.value.perms; }
                    rolePermissions.value = r; roleModal.value.show = false; showToast('Level ditambahkan secara lokal. Klik "Simpan Pengaturan" untuk menyimpannya permanen ke database.');
                };

                const deleteRole = () => {
                    if(roleModal.value.role === 'Admin') return showToast('Role Admin tidak bisa dihapus!', 'error');
                    rolePermissions.value.splice(roleModal.value.index, 1);
                    roleModal.value.show = false; showToast('Terhapus sementara. Klik "Simpan Pengaturan" untuk mempermanenkan penghapusan.');
                };

                const printTransaction = (trx, mode, type = 'Penjualan') => {
                    printMode.value = mode; let items = typeof trx.ItemsJSON === 'string' ? JSON.parse(trx.ItemsJSON) : trx.ItemsJSON;
                    let total = Number(trx.Total) || 0; let bayar = Number(trx.Bayar) || 0; let sisa = bayar < total ? total - bayar : 0;
                    printData.value = { id: trx.ID, tanggal: formatTgl(trx.Tanggal), items: items, total: total, bayar: bayar, kembali: trx.Kembali, sisa: sisa, kontak: trx.Pelanggan || trx.Supplier || 'Umum', tipe: type };
                    setTimeout(() => window.print(), 500);
                };

                const printPayment = (row, type) => {
                    printMode.value = 'struk_bayar';
                    printData.value = { id: row.ID_Trx, tanggal: formatTgl(row.Tanggal), kontak: row.Pelanggan || row.Supplier, jumlah: row.JumlahBayar, keterangan: row.Keterangan, tipe: type === 'bayar_hutang' ? 'Hutang' : 'Piutang' };
                    setTimeout(() => window.print(), 500);
                };

                const printReport = () => { printMode.value = 'laporan'; printHTMLContent.value = document.querySelector('.overflow-x-auto').innerHTML; setTimeout(() => window.print(), 500); };
                onMounted(() => { loadInitialData(); });

                return {
                    loading, isLoggedIn, currentUser, loginForm, isAdmin, hasAccess, doLogin, doLogout, sidebarOpen, currentRoute, routeTitle, todayDate, toast, db, tableSearch, posSearch, beliSearch, pos, beli, barangRusakForm,
                    formHutang, formPiutang, listHutang, listPiutang, reportType, reportFilterDate, reportFilterSupplier, reportFilterPelanggan, modal, formData, paymentModal, settingsForm, formFields, tableColumns, filteredTableData,
                    filteredPosBarang, filteredBeliBarang, posTotal, beliTotal, dashboardStats, pelangganPiutangTotal, filteredReports, reportDynamicColumns, reportTotals, printMode, printData, printHTMLContent,
                    rolePermissions, roleModal, availablePermissions, openRoleModal, saveRole, deleteRole,
                    formatRp, formatTgl, getSetting, openModal, submitForm, deleteData, addToCart, updateCartQty, openPaymentModal, processTransaction, cancelEdit, editTransaksi, hapusTransaksi, submitBarangRusak, submitBayarHutang, submitBayarPiutang, saveSettings, printTransaction, printPayment, printReport
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
